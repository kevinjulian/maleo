# Rust workspace for the shared editor core (OpenSpec: migrate-editor-to-shared-rust-core).
# Bun remains the toolchain for every TypeScript workspace; Cargo builds only crates/.
[workspace]
resolver = "3"
members = [
	"crates/app-core",
	"crates/editor-core",
	"crates/editor-wasm",
	"crates/media",
	"crates/preview",
	"crates/renderer",
	"crates/render-host",
	"crates/renderer-wasm",
]
exclude = ["vendor/vello_shaders"]

[patch.crates-io]
# Deterministic image sampling and analytic area; provenance: vendor/vello_shaders/MALEO_PATCH.md.
vello_shaders = { path = "vendor/vello_shaders" }

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# The WASM engine ships to browsers: optimise for size, and keep panics from
# pulling in unwinding machinery.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Symbol names were most of the module: porting the structural commands took it
# from 410,640 B to 673,921 B raw unstripped, and stripping brought it to
# 426,324 B. The next growth was serde's derived Deserialize for the internally
# tagged command enum; decoding commands by hand (`command.rs`) took the 29-type
# build from 473,361 B to 325,302 B raw; all 30 types are 352,009 B raw
# (123,059 B gzip) against the original budget. Caption command ownership needs
# `z`: the measured command build drops from 554,857 B / 186,301 B gzip to
# 489,369 B / 167,149 B gzip; edit latency remains enforced by engine budget tests.
strip = true

# The golden gate (crates/renderer/tests/golden) scores about 80 full-frame
# SSIMs and draws as many frames; unoptimized it took 7.5 minutes.
[profile.dev.package.maleo-renderer]
opt-level = 3

# The host's tests score full-size frames by SSIM; unoptimised, one case takes minutes.
[profile.dev.package.maleo-render-host]
opt-level = 3

# The render host is a native server binary: built for speed, not size, with
# `cargo build --profile render-host -p maleo-render-host`. The WASM builds keep
# `release` (p2-export E4).
[profile.render-host]
inherits = "release"
opt-level = 3
lto = "thin"
panic = "unwind"
strip = true

