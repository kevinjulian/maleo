[package]
name = "maleo-app-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Host-free editor state rules shared by every Maleo controller: undo ledger, selection, pending commands"

[dependencies]
maleo-editor-core = { path = "../editor-core" }
# Already in the lockfile. `f64::log10`/`powf` use the platform libm natively but
# this port in WASM; the fader calls it directly so every build gives one answer.
libm = "0.2.16"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
