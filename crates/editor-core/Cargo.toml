[package]
name = "maleo-editor-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Host-free editor command engine shared by every Maleo controller"

[dependencies]
maleo-media = { path = "../media" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
# `float_roundtrip`: the default float parser is not always correctly rounded
# (it read 1.9666666666666666 from the corpus as …663), which would change a
# number the engine never touched. `preserve_order` keeps passthrough key order.
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"], optional = true }

[features]
# Derives the TypeScript boundary types (`cargo test --features typescript`).
typescript = ["dep:ts-rs"]
