[package]
name = "maleo-renderer-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Browser build of maleo-renderer: wasm-bindgen exports over WebGPU and a canvas (ADR 0011)"

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is browser-only; a native build of the workspace compiles an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
maleo-renderer = { path = "../renderer" }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The CLI that generates the JS glue must be this exact version
# (scripts/build-renderer-wasm.ts, CI, Dockerfile).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
