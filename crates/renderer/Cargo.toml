[package]
name = "maleo-renderer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Draws video frames from the render storyboard with parley and vello on wgpu"

[dependencies]
maleo-editor-core = { path = "../editor-core" }
maleo-media = { path = "../media" }
# Versions from spike C, re-checked against the 14-day rule (p2-render-foundation 1.1).
# No `system` feature: the renderer reads only its bundled fonts (D5).
parley = { version = "=0.11.1", default-features = false, features = ["std"] }
vello = "=0.11.0"
wgpu = { version = "=30.0.1", default-features = false, features = [
	"std",
	"wgsl",
	"metal",
	"vulkan",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }

[dev-dependencies]
pollster = "=0.4.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
