[package]
name = "maleo-editor-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WebAssembly boundary for maleo-editor-core: a raw ABI over a document handle"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
maleo-app-core = { path = "../app-core" }
maleo-editor-core = { path = "../editor-core" }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
